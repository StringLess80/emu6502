# sbc6502.cfg - ld65 memory layout for the 6502 board's 32 KiB EEPROM.
#
#   $8000         JMP COLD_START   (type 8000R in WozMon to start BASIC)
#   $8003-$FCFF   MS BASIC (OSI version), about 7.9 KiB
#   $FD00-$FDFF   BIOS: CHRIN at $FD00, CHROUT at $FD03, BASIC's I/O
#   $FE00-$FFEA   WozMon
#   $FFEB-$FFF9   jump table where OSI BASIC expects its monitor
#   $FFFA-$FFFF   NMI, RESET, IRQ vectors

MEMORY {
    ZP:      start = $0000, size = $0100, type = rw;
    DUMMY:   start = $0000, size = $00FF, file = "";
    BASIC:   start = $8000, size = $7D00, type = ro, fill = yes, fillval = $FF, file = %O;
    BIOS:    start = $FD00, size = $0100, type = ro, fill = yes, fillval = $FF, file = %O;
    WOZ:     start = $FE00, size = $01EB, type = ro, fill = yes, fillval = $FF, file = %O;
    JUMPS:   start = $FFEB, size = $000F, type = ro, fill = yes, fillval = $FF, file = %O;
    VECS:    start = $FFFA, size = $0006, type = ro, fill = yes, file = %O;
}

SEGMENTS {
    ZEROPAGE:   load = ZP,    type = zp;
    BASICENTRY: load = BASIC, type = ro;
    HEADER:     load = BASIC, type = ro;
    VECTORS:    load = BASIC, type = ro;   # BASIC's own token table
    KEYWORDS:   load = BASIC, type = ro;
    ERROR:      load = BASIC, type = ro;
    CODE:       load = BASIC, type = ro;
    CHRGET:     load = BASIC, type = ro;
    INIT:       load = BASIC, type = ro;
    EXTRA:      load = BASIC, type = ro;
    DUMMY:      load = DUMMY;              # not included
    BIOS:       load = BIOS,  type = ro;
    WOZMON:     load = WOZ,   type = ro;
    MONJUMPS:   load = JUMPS, type = ro;
    RESETVEC:   load = VECS,  type = ro;
}
